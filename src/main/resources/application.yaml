server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ead-authuser
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
      jdbc:
        lob.non-contextual-creation: true
    properties:
      hibernate:
        show_sql: true

## padrão de cores ansi nos logs da aplicação
  output:
    ansi:
      enabled: always
## habilitando niveis de log por pacote
logging:
  level:
    com.ead: TRACE
    root: INFO
    org.hibernate: INFO
    org.springframework.web: